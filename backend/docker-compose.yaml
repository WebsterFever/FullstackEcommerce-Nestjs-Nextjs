services:
  nestapp:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgresdb:
        condition: service_healthy

  postgresdb:
    image: "postgres:17.7"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: